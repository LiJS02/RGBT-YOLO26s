# YOLO26 two-stream visible + infrared detector with independent P1-P3 stems, elementwise P3 fusion, and a shared
# P4/P5 backbone followed by the original YOLO26 neck and detection head.
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 6 # number of classes, override for other RGB-T datasets
channels: 6 # stacked visible (BGR) + infrared (BGR) input channels
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26s-rgbt.yaml' will call yolo26-rgbt.yaml with scale 's'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Each modality has its own YOLO26 P1-P3 stem. The two P3 feature maps are added elementwise, then one shared P4/P5
# backbone and the original YOLO26 P3/P4/P5 neck and head process the fused feature.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, ChannelSlice, [0, 6]] # 0-6-channel visible + infrared input, kept for both streams
  - [-1, 1, ChannelSlice, [0, 3]] # 1-visible (BGR)
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 4
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 6-visible P3/8

  - [0, 1, ChannelSlice, [3, 6]] # 7-infrared (BGR)
  - [-1, 1, Conv, [64, 3, 2]] # 8-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 9-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 10
  - [-1, 1, Conv, [256, 3, 2]] # 11-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 12-infrared P3/8

  - [[6, 12], 1, Add, []] # 13-fuse visible and infrared P3 elementwise
  - [-1, 1, Conv, [512, 3, 2]] # 14-P4/16 shared
  - [-1, 2, C3k2, [512, True]] # 15-shared P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 16-P5/32 shared
  - [-1, 2, C3k2, [1024, True]] # 17
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 18
  - [-1, 2, C2PSA, [1024]] # 19-shared P5/32

# Original YOLO26 neck and head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 20
  - [[-1, 15], 1, Concat, [1]] # 21-cat shared P4
  - [-1, 2, C3k2, [512, True]] # 22

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24-cat fused P3
  - [-1, 2, C3k2, [256, True]] # 25-P3/8-small

  - [-1, 1, Conv, [256, 3, 2]] # 26
  - [[-1, 22], 1, Concat, [1]] # 27-cat head P4
  - [-1, 2, C3k2, [512, True]] # 28-P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]] # 29
  - [[-1, 19], 1, Concat, [1]] # 30-cat shared P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 31-P5/32-large

  - [[25, 28, 31], 1, Detect, [nc]] # 32-Detect(P3, P4, P5)
